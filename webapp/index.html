<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esse Expert AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a; /* Slate 900 */
            --glass-bg: rgba(30, 41, 59, 0.7); /* Slate 800 with opacity */
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6; /* Violet 500 */
            --primary-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f8fafc; /* Slate 50 */
            --text-muted: #cbd5e1; /* Slate 300 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"], select, textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            line-height: 1.5;
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .word-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
        }

        /* Telegram theme integration */
        body.tg-theme {
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-main));
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Esse Expert AI</h1>
        <p class="subtitle">Essengizni sun'iy intellekt orqali tekshiring</p>

        <div class="form-group">
            <label for="criteria">Baholash mezoni</label>
            <select id="criteria">
                <option value="milliy">Milliy Sertifikat (B2/C1)</option>
                <option value="ielts">IELTS Academic (Task 2)</option>
                <option value="cefr">CEFR Standarti</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topic">Esse mavzusi (Task)</label>
            <input type="text" id="topic" placeholder="Mavzuni kiriting (yoki ixtiyoriy)...">
        </div>

        <div class="form-group">
            <label for="essay">Esse matni</label>
            <textarea id="essay" placeholder="Shu yerga essengizni yozing yoki nusxalab tashlang..."></textarea>
            <div class="word-count" id="wordCount">0 ta so'z</div>
        </div>

        <button class="btn-submit" id="submitBtn">Tahlil qilish</button>
    </div>

    <script>
        // Telegram WebApp obyekti
        const tg = window.Telegram.WebApp;
        tg.expand(); // Ekranni to'liq egallash

        // Telegram ranglarini moslashtirish (ixtiyoriy)
        if (tg.colorScheme) {
            document.body.classList.add('tg-theme');
        }

        const essayInput = document.getElementById('essay');
        const topicInput = document.getElementById('topic');
        const criteriaInput = document.getElementById('criteria');
        const submitBtn = document.getElementById('submitBtn');
        const wordCountDisplay = document.getElementById('wordCount');

        // So'z sanagich
        essayInput.addEventListener('input', () => {
            const text = essayInput.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCountDisplay.textContent = `${words} ta so'z`;

            // Agar kamida 10 ta so'z bo'lsa tugmani yoqish
            if (words >= 10) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        });

        // Dastlab tugmani o'chirish
        submitBtn.disabled = true;

        // Tugma bosilganda
        submitBtn.addEventListener('click', () => {
            const data = {
                criteria: criteriaInput.value,
                topic: topicInput.value.trim(),
                essay: essayInput.value.trim()
            };

            // Telegram botga ma'lumotni yuborish
            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
