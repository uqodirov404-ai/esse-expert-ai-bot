<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esse Eksperti</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .dark .glass { background: rgba(31, 41, 55, 0.7); border: 1px solid rgba(255,255,255,0.05); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Modern Loader */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .image-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
        .file-upload-label { cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #3b82f6; border-radius: 12px; padding: 20px; transition: all 0.2s; }
        .file-upload-label:hover { background-color: rgba(59, 130, 246, 0.05); }
    </style>
</head>
<body class="pb-24 transition-colors duration-200">

    <!-- Header -->
    <header class="glass sticky top-0 z-50 px-4 py-3 shadow-sm">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-600">Esse Eksperti</h1>
    </header>

    <!-- Main Content Area -->
    <main class="p-4">
        
        <!-- Tab 1: AI Tekshiruv -->
        <section id="tab-ai" class="tab-content active">
            <div class="bg-gray-800 text-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700">
                <h2 class="text-lg font-bold mb-4">🤖 AI Tekshiruv (Bepul)</h2>
                <form id="aiForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Mezonni tanlang</label>
                        <select id="aiCriteria" class="w-full rounded-xl border-gray-300 dark:border-gray-600 dark:bg-gray-700 p-3 outline-none focus:ring-2 focus:ring-blue-500 transition-shadow">
                            <option value="Milliy Sertifikat (B2, C1)">Milliy Sertifikat (B2, C1)</option>
                            <option value="CEFR">CEFR</option>
                            <option value="IELTS">IELTS</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Mavzu (ixtiyoriy)</label>
                        <input type="text" id="aiTopic" placeholder="Esse mavzusi..." class="w-full rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 p-3 outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Esse matni</label>
                        <textarea id="aiText" rows="4" placeholder="Matnni bu yerga yozing..." class="w-full rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 p-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <span class="block text-sm font-medium mb-1">Yoki rasmlarni yuklang</span>
                        <label class="file-upload-label">
                            <span class="text-2xl mb-2">📸</span>
                            <span class="text-sm text-blue-500 font-medium">Rasmlarni tanlash</span>
                            <input type="file" id="aiFiles" multiple accept="image/*" class="hidden" onchange="previewImages(this, 'aiPreview')">
                        </label>
                        <div id="aiPreview" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 transform transition hover:scale-[1.02] active:scale-95 flex justify-center items-center">
                        <span id="aiBtnText">Tekshirishga yuborish</span>
                        <div id="aiLoader" class="loader ml-2 hidden"></div>
                    </button>
                </form>
            </div>
        </section>

        <!-- Tab 2: Ekspertlar -->
        <section id="tab-experts" class="tab-content">
            <div id="expertList" class="space-y-4">
                <div class="text-center py-10"><div class="loader mx-auto"></div></div>
            </div>
            
            <!-- Order Form (Hidden initially) -->
            <div id="orderForm" class="hidden bg-gray-800 text-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 mt-4">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-bold">Buyurtma berish</h2>
                    <button onclick="closeOrderForm()" class="text-red-500 font-bold p-2 bg-red-50 rounded-lg">✕</button>
                </div>
                <div class="bg-blue-50 dark:bg-gray-700 p-4 rounded-xl mb-4">
                    <p class="text-sm">Xizmat narxi: <b id="orderPrice" class="text-blue-600">0</b> UZS</p>
                    <p class="text-sm mt-2">Karta: <b id="orderCard" class="text-blue-600 tracking-wider">...</b></p>
                    <p class="text-xs text-gray-500 mt-1">Shu kartaga to'lov qilib, chekni pastga yuklang.</p>
                </div>
                <form id="humanForm" class="space-y-4">
                    <input type="hidden" id="orderExpertId">
                    <div>
                        <label class="block text-sm font-medium mb-1 text-red-500">To'lov cheki (skrinshot) *</label>
                        <input type="file" id="orderReceipt" accept="image/*" required class="w-full text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Esse matni</label>
                        <textarea id="orderText" rows="3" placeholder="Matnni bu yerga yozing..." class="w-full rounded-xl border border-gray-300 dark:border-gray-600 dark:bg-gray-700 p-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                    <div>
                        <span class="block text-sm font-medium mb-1">Yoki rasmlarni yuklang</span>
                        <label class="file-upload-label">
                            <span class="text-xl mb-1">📸</span>
                            <span class="text-sm text-blue-500 font-medium">Rasmlarni tanlash</span>
                            <input type="file" id="orderFiles" multiple accept="image/*" class="hidden" onchange="previewImages(this, 'orderPreview')">
                        </label>
                        <div id="orderPreview" class="flex flex-wrap gap-2 mt-3"></div>
                    </div>
                    <button type="submit" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform transition hover:scale-[1.02] active:scale-95 flex justify-center items-center">
                        <span id="humanBtnText">Yuborish</span>
                        <div id="humanLoader" class="loader ml-2 hidden border-white"></div>
                    </button>
                </form>
            </div>
        </section>

        <!-- Tab 3: Kabinet -->
        <section id="tab-cabinet" class="tab-content">
            <div id="cabinetContent" class="space-y-4">
                <div class="text-center py-10"><div class="loader mx-auto"></div></div>
            </div>
        </section>
        
        <!-- Tab 4: Admin Panel -->
        <section id="tab-admin" class="tab-content">
            <div class="bg-gray-800 text-white dark:bg-gray-800 rounded-2xl p-5 shadow-sm border border-gray-100 dark:border-gray-700 space-y-6">
                <h2 class="text-lg font-bold text-red-500 flex items-center">⚙️ Admin Panel</h2>
                
                <div class="space-y-3">
                    <h3 class="font-semibold text-sm text-gray-500 uppercase tracking-wider">To'lov Sozlamalari</h3>
                    <input type="text" id="adminPrice" placeholder="Narx (UZS)" class="w-full rounded-xl border p-3 dark:bg-gray-700 dark:border-gray-600">
                    <input type="text" id="adminCard" placeholder="Karta raqami" class="w-full rounded-xl border p-3 dark:bg-gray-700 dark:border-gray-600">
                    <button onclick="saveAdminSettings()" class="bg-gray-800 text-white rounded-xl py-2 px-4 w-full">Saqlash</button>
                </div>
                
                <hr class="border-gray-200 dark:border-gray-700">
                
                <div class="space-y-3">
                    <h3 class="font-semibold text-sm text-gray-500 uppercase tracking-wider">Ekspertlar Boshqaruvi</h3>
                    <div id="adminExpertsList" class="space-y-2"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="glass fixed bottom-0 w-full flex justify-around items-center p-3 border-t border-gray-200 dark:border-gray-800 pb-safe">
        <button onclick="switchTab('ai')" class="nav-btn flex flex-col items-center text-blue-600" data-target="ai">
            <span class="text-2xl mb-1">🤖</span>
            <span class="text-[10px] font-semibold">AI</span>
        </button>
        <button onclick="switchTab('experts')" class="nav-btn flex flex-col items-center text-gray-400" data-target="experts">
            <span class="text-2xl mb-1">👨‍🏫</span>
            <span class="text-[10px] font-semibold">Ekspert</span>
        </button>
        <button onclick="switchTab('cabinet')" class="nav-btn flex flex-col items-center text-gray-400" data-target="cabinet">
            <span class="text-2xl mb-1">👤</span>
            <span class="text-[10px] font-semibold">Kabinet</span>
        </button>
        <button id="navAdmin" onclick="switchTab('admin')" class="hidden nav-btn flex flex-col items-center text-gray-400" data-target="admin">
            <span class="text-2xl mb-1">⚙️</span>
            <span class="text-[10px] font-semibold">Admin</span>
        </button>
    </nav>

    <script src="/static/app.js"></script>
</body>
</html>
