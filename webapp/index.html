<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Esse Expert AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        input[type="text"], select, textarea, input[type="file"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="file"] {
            padding: 10px;
        }

        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        textarea {
            resize: vertical;
            min-height: 150px;
            line-height: 1.5;
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .word-count {
            text-align: right;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
        }
        
        .divider {
            text-align: center;
            margin: 15px 0;
            color: var(--text-muted);
            font-size: 14px;
            position: relative;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--glass-border);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        body.tg-theme {
            background-color: var(--tg-theme-bg-color, var(--bg-color));
            color: var(--tg-theme-text-color, var(--text-main));
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Esse Expert AI</h1>
        <p class="subtitle">Essengizni sun'iy intellekt orqali tekshiring</p>

        <div class="form-group">
            <label for="criteria">Baholash mezoni</label>
            <select id="criteria">
                <option value="milliy">Milliy Sertifikat</option>
                <option value="ielts">IELTS Academic</option>
                <option value="cefr">CEFR Standarti</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topic">Esse mavzusi</label>
            <input type="text" id="topic" placeholder="Mavzuni kiriting (yoki ixtiyoriy)...">
        </div>

        <div class="form-group">
            <label for="essay">Esse matni</label>
            <textarea id="essay" placeholder="Shu yerga essengizni yozing yoki nusxalab tashlang..."></textarea>
            <div class="word-count" id="wordCount">0 ta so'z</div>
        </div>
        
        <div class="divider">YOKI</div>
        
        <div class="form-group">
            <label for="image">Qo'lyozma rasm yuklash</label>
            <input type="file" id="image" accept="image/*">
        </div>

        <button class="btn-submit" id="submitBtn">Esseni baholatish</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.colorScheme) {
            document.body.classList.add('tg-theme');
        }

        const essayInput = document.getElementById('essay');
        const topicInput = document.getElementById('topic');
        const criteriaInput = document.getElementById('criteria');
        const imageInput = document.getElementById('image');
        const submitBtn = document.getElementById('submitBtn');
        const wordCountDisplay = document.getElementById('wordCount');

        function checkInputs() {
            const text = essayInput.value.trim();
            const words = text ? text.split(/\s+/).length : 0;
            wordCountDisplay.textContent = words + " ta so'z";

            const hasText = words >= 10;
            const hasImage = imageInput.files.length > 0;

            if (hasText || hasImage) {
                submitBtn.disabled = false;
            } else {
                submitBtn.disabled = true;
            }
        }

        essayInput.addEventListener('input', checkInputs);
        imageInput.addEventListener('change', checkInputs);
        submitBtn.disabled = true;

        submitBtn.addEventListener('click', async () => {
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Jo\'natilmoqda...';
            
            // Foydalanuvchi ID sini Telegram dan olish
            let userId = 0;
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = tg.initDataUnsafe.user.id;
            } else {
                // Test uchun fallback
                userId = 162634410; 
            }

            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('criteria', criteriaInput.value);
            formData.append('topic', topicInput.value.trim());
            formData.append('text', essayInput.value.trim());
            
            if (imageInput.files.length > 0) {
                formData.append('file', imageInput.files[0]);
            }

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    tg.showAlert("Essengiz muvaffaqiyatli yuborildi! Natijani bot chatida kutib oling.");
                    tg.close();
                } else {
                    tg.showAlert("Xatolik yuz berdi. Iltimos qaytadan urinib ko'ring.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Esseni baholatish';
                }
            } catch (error) {
                tg.showAlert("Internet ulanishida xatolik!");
                submitBtn.disabled = false;
                submitBtn.textContent = 'Esseni baholatish';
            }
        });
    </script>
</body>
</html>
